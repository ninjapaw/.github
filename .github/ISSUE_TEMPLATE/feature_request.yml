name: Feature request
description: Suggest an improvement or new demo capability.
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or scenario
      description: What community, customer, demo, or learning scenario would this help?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the change you would like to see.
    validations:
      required: true
  - type: textarea
    id: considerations
    attributes:
      label: Security, privacy, cost, or licensing considerations
      description: Note any expected tenant data, permissions, Azure costs, licensing, or deployment impact.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I have not included secrets, credentials, tokens, tenant data, customer data, or sensitive logs.
          required: true
